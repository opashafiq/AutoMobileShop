<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Modernize Color Palette Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D87FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7298FF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bluePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7298FF"/>
      <stop offset="100%" stop-color="#4570EA"/>
    </linearGradient>
    <linearGradient id="navyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333F55"/>
      <stop offset="100%" stop-color="#1E2530"/>
    </linearGradient>
    <linearGradient id="silverChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- High-End Soft Ambient Drop Shadows -->
    <filter id="softCardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2A3547" flood-opacity="0.07"/>
    </filter>
    <filter id="wheelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2A3547" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Transparent Root: Removed solid rect so elements sit natively on #ECF2FF -->

  <!-- Soft Concentric Radial Glows -->
  <circle cx="200" cy="200" r="165" fill="url(#bgGlow)"/>
  <circle cx="200" cy="200" r="125" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="200" cy="200" r="85" fill="url(#bgGlow)"/>

  <!-- BACKDROP CARD: System Dashboard Preview -->
  <g filter="url(#softCardShadow)">
    <rect x="65" y="75" width="135" height="90" rx="14" fill="#5D87FF"/>
    <rect x="78" y="90" width="55" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="78" y="104" width="85" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="78" y="116" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
    <!-- Status Check Icon -->
    <circle cx="168" cy="120" r="14" fill="#13DEB9"/>
    <path d="M163 120 L166 123 L173 116" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- MAIN ELEMENT: Performance Alloy Wheel & Tire -->
  <g filter="url(#wheelShadow)">
    <!-- Outer Rubber Tire -->
    <circle cx="215" cy="225" r="95" fill="url(#navyDark)"/>
    
    <!-- Tire Treads & Grooves -->
    <circle cx="215" cy="225" r="90" fill="none" stroke="#475569" stroke-width="3.5" stroke-dasharray="10 7"/>
    <circle cx="215" cy="225" r="82" fill="#2A3547"/>

    <!-- Alloy Rim Outer Ring -->
    <circle cx="215" cy="225" r="68" fill="url(#silverChrome)"/>
    <circle cx="215" cy="225" r="63" fill="url(#bluePrimary)"/>

    <!-- 5-Spoke Alloy Rim Pattern -->
    <g fill="url(#silverChrome)">
      <circle cx="215" cy="225" r="22"/>
      <path d="M215 225 L210 163 L220 163 Z"/>
      <path d="M215 225 L274 205 L269 214 Z"/>
      <path d="M215 225 L251 274 L243 278 Z"/>
      <path d="M215 225 L179 274 L187 278 Z"/>
      <path d="M215 225 L156 205 L161 214 Z"/>
    </g>

    <!-- Center Cap & Brand Badge -->
    <circle cx="215" cy="225" r="14" fill="#2A3547"/>
    <circle cx="215" cy="225" r="10" fill="url(#bluePrimary)"/>
    <path d="M210 227 L213 221 L215 224 L217 221 L220 227" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Chrome Lug Nuts -->
    <circle cx="215" cy="210" r="2.8" fill="#FFFFFF"/>
    <circle cx="229" cy="219" r="2.8" fill="#FFFFFF"/>
    <circle cx="223" cy="235" r="2.8" fill="#FFFFFF"/>
    <circle cx="207" cy="235" r="2.8" fill="#FFFFFF"/>
    <circle cx="201" cy="219" r="2.8" fill="#FFFFFF"/>
  </g>

  <!-- FLOATING BADGE 1: Tool / Wrench Service (Top Right) -->
  <g filter="url(#softCardShadow)" transform="translate(280, 95)">
    <circle cx="20" cy="20" r="26" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="20" fill="#13DEB9"/>
    <!-- Service Wrench Icon -->
    <path d="M14 26 L19 21 M18 14 C16 14 14 16 14 18 C14 19.2 15 20.4 16.2 21 L23.5 13.8 C22.8 12.6 21.5 11.8 20 11.8 C18.2 11.8 17 13 17 15" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- FLOATING BADGE 2: Spline Lug Nut / Hardware Detail (Bottom Left) -->
  <g filter="url(#softCardShadow)" transform="translate(50, 250)">
    <rect width="70" height="52" rx="14" fill="#FFFFFF"/>
    <!-- Polygon Spline Lug Nut -->
    <polygon points="35,11 45,16.5 45,27.5 35,33 25,27.5 25,16.5" fill="url(#bluePrimary)"/>
    <circle cx="35" cy="22" r="3.5" fill="#FFFFFF"/>
    <rect x="18" y="39" width="34" height="4" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- FLOATING BADGE 3: Price / Sales Indicator (Bottom Right) -->
  <g filter="url(#softCardShadow)" transform="translate(250, 275)">
    <rect width="95" height="44" rx="14" fill="#FFFFFF"/>
    <circle cx="22" cy="22" r="11" fill="#FA896B"/>
    <!-- Dollar Tag Icon -->
    <path d="M22 17 V27 M20 19 H23 C24 19 24 21 22 22 C20 23 20 25 24 25 H24.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="40" y="15" width="42" height="6" rx="3" fill="#2A3547"/>
    <rect x="40" y="25" width="28" height="5" rx="2.5" fill="#13DEB9"/>
  </g>
</svg>
